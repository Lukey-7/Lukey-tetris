name: lukey_tetris
description: Retro 8-Bit Classic Tetris Android Application with live OTA updates, polyominoes, and chiptune jukebox.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  shared_preferences: ^2.2.2
  vibration: ^1.9.0
  url_launcher: ^6.2.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/css/
    - assets/web/js/

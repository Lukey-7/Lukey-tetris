name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync Web Assets to Flutter App
        run: |
          mkdir -p flutter_app/assets/web/css flutter_app/assets/web/js flutter_app/assets/web/icons
          cp index.html popup.html space.html space_popup.html manifest.json sw.js flutter_app/assets/web/
          cp -r css/* flutter_app/assets/web/css/
          cp -r js/* flutter_app/assets/web/js/
          cp -r icons/* flutter_app/assets/web/icons/

      - name: Generate Android Gradle Project
        run: |
          # Generate the standard Gradle setup for the current Flutter version, then
          # layer it under our own manifest, MainActivity, styles and launcher icons
          # (--update=none never overwrites files already in the repo).
          flutter create --platforms=android --org com.lukey --project-name tetris "$RUNNER_TEMP/scaffold"
          cp -r --update=none "$RUNNER_TEMP/scaffold/android/." flutter_app/android/

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Read App Version
        run: |
          # pubspec.yaml is the single source of truth, e.g. "version: 1.1.0+2"
          VERSION=$(grep '^version:' flutter_app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Keep the in-app update checker in sync with the release tag
          sed -i "s/currentVersion = '[^']*'/currentVersion = 'v$VERSION'/" flutter_app/lib/services/update_service.dart
          grep currentVersion flutter_app/lib/services/update_service.dart

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/lukey-arcade-v${APP_VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lukey-arcade-v${{ env.APP_VERSION }}
          path: flutter_app/build/app/outputs/flutter-apk/lukey-arcade-v${{ env.APP_VERSION }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Lukey Arcade v${{ env.APP_VERSION }}"
          make_latest: true
          body: |
            **Lukey Arcade v${{ env.APP_VERSION }}** - Tetris-89 + Star Vanguard

            ### Star Vanguard
            - Galaga-style formations and dive attacks, named stages, a bonus stage, and a Dreadnought boss with destructible wing pods
            - Tractor beam: Commanders can capture your fighter - shoot them on the dive to rescue it as a dual fighter
            - Top-10 Hall of Aces per mode with arcade initials entry and a results screen
            - True 8-bit pixel graphics and an NES-style chiptune soundtrack

            ### Tetris-89
            - Classic 7 pieces by default; Sprint, Blitz, Marathon, Zen and Daily Challenge modes
            - Swipe controls, music/effects volume sliders, Pentomino Wild mode

            ### Installation
            Download `lukey-arcade-v${{ env.APP_VERSION }}.apk` below and open it on your Android phone.
          files: flutter_app/build/app/outputs/flutter-apk/lukey-arcade-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
